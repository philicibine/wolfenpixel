<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0514">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NEON DRIFT</title>
<style>
  html,body{margin:0;padding:0;background:#05020c;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #c{display:block;position:absolute;left:0;top:0}
  #mute{position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:5;font:700 20px system-ui;color:#8ff;background:#10061f;border:2px solid #2de;padding:4px 12px;border-radius:12px;opacity:.8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute">🔊</button>
<script>
"use strict";
window.onerror = function(msg, src, line) { (window.__errs = window.__errs || []).push(msg + " @" + line); };

/* ================= NEON DRIFT — one-thumb endless drift racer =================
   built by pixel 🤖 · all graphics + sound generated in this file, zero assets */

const VW = 420, VH = 780;                 // logical view
const cv = document.getElementById("c");
const cx = cv.getContext("2d");
let scale = 1, offX = 0, offY = 0;

function fit() {
  const w = innerWidth, h = innerHeight;
  cv.width = w * devicePixelRatio; cv.height = h * devicePixelRatio;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  scale = Math.min(w / VW, h / VH);
  offX = (w - VW * scale) / 2; offY = (h - VH * scale) / 2;
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
addEventListener("resize", fit); fit();

const R = Math.random;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- audio (created on first tap) ---------------- */
let AC = null, eng, engGain, driftNode, driftGain, muted = false;
function audioInit() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    eng = AC.createOscillator(); eng.type = "sawtooth"; eng.frequency.value = 60;
    engGain = AC.createGain(); engGain.gain.value = 0;
    const engFilter = AC.createBiquadFilter(); engFilter.type = "lowpass"; engFilter.frequency.value = 500;
    eng.connect(engFilter); engFilter.connect(engGain); engGain.connect(AC.destination); eng.start();
    const buf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    driftNode = AC.createBufferSource(); driftNode.buffer = buf; driftNode.loop = true;
    const df = AC.createBiquadFilter(); df.type = "bandpass"; df.frequency.value = 1800; df.Q.value = 1.2;
    driftGain = AC.createGain(); driftGain.gain.value = 0;
    driftNode.connect(df); df.connect(driftGain); driftGain.connect(AC.destination); driftNode.start();
  } catch (e) { AC = null; }
}
function blip(freq, dur, type, vol) {
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.2, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + (dur || 0.15));
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (dur || 0.15) + 0.02);
}
function thump() {
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(120, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(38, AC.currentTime + 0.22);
  g.gain.setValueAtTime(0.5, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.3);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.32);
}
document.getElementById("mute").addEventListener("click", function (e) {
  e.stopPropagation(); muted = !muted;
  this.textContent = muted ? "🔇" : "🔊";
  if (muted) { if (engGain) engGain.gain.value = 0; if (driftGain) driftGain.gain.value = 0; }
});

/* ---------------- input ---------------- */
let touchSide = 0;              // -1 left, +1 right, 0 none
let touchX = null;
window.__fire = function (x, y, down) {         // debug/sim hook
  touchX = x;
  if (state === "menu" && down) { startRun(); return; }
};
cv.addEventListener("pointerdown", function (e) {
  audioInit(); if (AC && AC.state === "suspended") AC.resume();
  const gx = (e.clientX - offX) / scale;
  window.__fire(gx, 0, true);
  touchSide = gx < VW / 2 ? -1 : 1;
  touchX = gx;
  if (state === "menu") { startRun(); }
});
cv.addEventListener("pointermove", function (e) {
  const gx = (e.clientX - offX) / scale;
  touchX = gx;
  touchSide = gx < VW / 2 ? -1 : 1;
});
addEventListener("pointerup", function () { touchSide = 0; touchX = null; });
addEventListener("keydown", function (e) {
  if (e.key === "ArrowLeft" || e.key === "a") { steerKey = -1; }
  if (e.key === "ArrowRight" || e.key === "d") { steerKey = 1; }
  if (state === "menu" && (e.key === " " || e.key === "Enter")) startRun();
});
addEventListener("keyup", function (e) {
  if (e.key === "ArrowLeft" || e.key === "a") steerKey = 0;
  if (e.key === "ArrowRight" || e.key === "d") steerKey = 0;
});
let steerKey = 0;

/* ---------------- game state ---------------- */
let state = "menu";
let best = +(localStorage.getItem("neondrift_best") || 0);
if (location.search.indexOf("reset") >= 0) { localStorage.removeItem("neondrift_best"); best = 0; }
let dist = 0, speed = 0, carX = 0, carVX = 0, steer = 0, tilt = 0;
let combo = 0, comboT = 0, comboBank = 0;
let score = 0, gems = 0, runTime = 0;
let shake = 0, flash = 0, hitFlash = 0;
let items = [];        // {z, off, kind}
let lastItemZ = 320;
function ensureItems() {
  while (lastItemZ < dist + 950) {
    spawnAhead(lastItemZ);
    lastItemZ += 120 + R() * 170;
  }
}
let parts = [], pops = [];
let stars = [];
for (let i = 0; i < 70; i++) stars.push({ x: R() * VW, y: R() * VH, s: 0.5 + R() * 1.6, tw: R() * 6.28 });

// per-run random road shape
let roadSeed = [0, 0, 0, 0];
function roadShape() { roadSeed = [R() * 6.28, R() * 6.28, R() * 6.28, R() * 6.28]; }
function curveAt(z) {
  return Math.sin(z * 0.0011 + roadSeed[0]) * 46
       + Math.sin(z * 0.0027 + roadSeed[1]) * 26
       + Math.sin(z * 0.0063 + roadSeed[2]) * 11
       + Math.sin(z * 0.0131 + roadSeed[3]) * 5;
}
const ROAD_HALF = 108;

function startRun() {
  if (state === "play") return;
  state = "play";
  dist = 0; speed = 130; carX = 0; carVX = 0; steer = 0; tilt = 0;
  combo = 0; comboT = 0; comboBank = 0; score = 0; gems = 0; runTime = 0;
  shake = 0; flash = 0.4; hitFlash = 0;
  items = []; parts = []; pops = [];
  roadShape();
  lastItemZ = 320;
  blip(660, 0.1, "square", 0.25); blip(880, 0.12, "square", 0.25);
}
function spawnAhead(z) {
  const r = R();
  if (r < 0.42) items.push({ z: z, off: (R() * 2 - 1) * (ROAD_HALF - 34), kind: "gem" });
  else if (r < 0.56) items.push({ z: z, off: (R() * 2 - 1) * (ROAD_HALF - 60), kind: "boost" });
  else if (r < 0.78) {
    const n = 1 + (R() * 3 | 0);
    for (let k = 0; k < n; k++)
      items.push({ z: z + k * 55, off: (R() * 2 - 1) * (ROAD_HALF - 30), kind: "cone" });
  }
}

/* ---------------- particles + popups ---------------- */
function puff(x, y, col, n, spd, life, size) {
  for (let i = 0; i < n; i++) {
    const a = R() * 6.283, s = (0.3 + R() * 0.7) * spd;
    parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.6, t: 0, life: life * (0.6 + R() * 0.7), col: col, size: size * (0.6 + R() * 0.8) });
  }
}
function pop(x, y, text, col, size) { pops.push({ x: x, y: y, text: text, col: col || "#8ff", t: 0, size: size || 16 }); }

function addScore(v) { score += v; }

/* ---------------- update ---------------- */
let last = performance.now();
function update(dt) {
  runTime += dt;
  // steering input: two-thumb sides OR single touch position
  const keySteer = steerKey;
  let target = keySteer;
  if (touchSide !== 0) {
    // single-touch maps distance-from-centre to strength
    if (touchX !== null) {
      const fromC = clamp((touchX - VW / 2) / (VW / 2), -1, 1);
      target = Math.abs(fromC) < 0.12 ? 0 : clamp(fromC * 2.2, -1, 1);
    } else target = touchSide;
  }
  steer = lerp(steer, target, 1 - Math.pow(0.0015, dt));

  speed = lerp(speed, 300, 1 - Math.pow(0.3, dt));             // creeping top speed w/ gems boosts
  if (boostT > 0) { boostT -= dt; speed = 430; }

  carVX += steer * 260 * dt * (speed / 300);
  carVX *= Math.pow(0.12, dt);                                  // grip
  carX += carVX * dt;

  const roadC = curveAt(dist + 190);                            // road centre at car depth
  const off = carX - roadC;
  const drifting = Math.abs(steer) > 0.4 && speed > 180 && Math.abs(carVX) > 60;
  if (drifting) {
    comboT += dt;
    combo = 1 + Math.min(9, Math.floor(comboT / 1.1));
    if (comboT > 0.12 && R() < 0.5) {
      puff(VW / 2 + carX + (R() < 0.5 ? -12 : 12), VH * 0.8 + 6, driftSmokeCol(), 1, 40, 0.5, 7);
    }
  } else {
    if (comboT > 0.9) {
      comboBank += Math.round(30 * combo);
      pop(VW / 2 + carX, VH * 0.74 - 40, "+" + (30 * combo) + " DRIFT x" + combo, "#ffe066", 15);
      blip(500 + combo * 60, 0.08, "square", 0.18);
    }
    comboT = Math.max(0, comboT - dt * 1.6); combo = 1 + Math.min(9, Math.floor(comboT / 1.1));
  }
  tilt = lerp(tilt, driftAngleVisual(), 1 - Math.pow(0.002, dt));

  // off-road penalty
  if (Math.abs(off) > ROAD_HALF - 14) {
    speed *= Math.pow(0.25, dt);
    if (R() < 0.5) puff(VW / 2 + carX, VH * 0.82, "#5a4a7a", 1, 30, 0.4, 5);
    if (comboT > 0) { comboT = 0; combo = 0; }
  }

  dist += speed * dt * 0.95;                                    // world roll (fast!)
  if (state === "play") addScore(dt * (1 + combo * 0.55) * (14 + speed * 0.05));
  ensureItems();

  // items
  while (items.length && items[0].z < dist - 300) items.shift();
  for (const it of items) {
    if (it.dead) continue;
    const zRel = it.z - (dist - 300);
    const y = VH * 0.78 - (zRel - 190) * 1.44;
    if (y > VH || y < -40) continue;
    const ix = VW / 2 + it.off + curveAt(it.z) - curveAt(dist + 190);
    const dx = (carX) - (it.off), hitZ = Math.abs(zRel - 190) < 34 && Math.abs(dx) < 30;
    if (hitZ && state === "play") {
      it.dead = true;
      if (it.kind === "gem") { gems++; addScore(12 * (1 + combo * 0.4)); pop(ix, y, "+💎", "#7df", 16); blip(980, 0.09, "square", 0.15); puff(ix, y, "#8ff", 6, 60, 0.4, 4); }
      else if (it.kind === "boost") { boostT = 1.4; pop(ix, y, "BOOST!", "#f6a", 18); blip(1200, 0.14, "sawtooth", 0.2); shake = Math.max(shake, 5); }
      else {
        // cone: spin-out
        comboT = 0; combo = 0; shake = Math.max(shake, 9); thump();
        pop(ix, y, "CRUNCH", "#ff6b6b", 18);
        carVX = (dx > 0 ? -1 : 1) * 320; speed *= 0.55;
        puff(ix, y, "#fa0", 10, 90, 0.5, 5);
        score = Math.max(0, score - 120); pop(VW / 2 + carX, VH * 0.6, "-120", "#ff6b6b", 16);
      }
    }
    else if (it.kind === "cone" && Math.abs(zRel - 190) < 60 && R() < 0.02) puff(ix, y, "rgba(255,160,60,0.7)", 1, 12, 0.5, 3);
  }

  // particles + popups
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 30 * dt;
    if (p.t > p.life) parts.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    const q = pops[i]; q.t += dt; q.y -= 28 * dt;
    if (q.t > 0.9) pops.splice(i, 1);
  }
  shake = Math.max(0, shake - dt * 22);
  flash = Math.max(0, flash - dt * 2);

  // audio follows the car
  if (AC && !muted) {
    eng.frequency.value = 55 + speed * 0.42 + Math.sin(runTime * 30) * 4;
    engGain.gain.value = state === "play" ? 0.08 : 0.02;
    driftGain.gain.value = drifting ? clamp(Math.abs(carVX) / 2600, 0, 0.14) : 0;
  }
}

let boostT = 0;
function driftSmokeCol() { return R() < 0.5 ? "rgba(180,220,255,0.55)" : "rgba(255,120,220,0.5)"; }
function driftAngleVisual() { return clamp(carVX * 0.0027, -0.5, 0.5) + steer * 0.18; }

/* ---------------- render ---------------- */
function render() {
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  cx.fillStyle = "#05020c"; cx.fillRect(0, 0, innerWidth, innerHeight);
  cx.save();
  cx.translate(offX, offY);
  if (shake > 0) cx.translate((R() - 0.5) * shake, (R() - 0.5) * shake);

  // sky + stars
  const g = cx.createLinearGradient(0, 0, 0, VH * 0.4);
  g.addColorStop(0, "#0b0514"); g.addColorStop(1, "#170a2b");
  cx.fillStyle = g; cx.fillRect(0, 0, VW, VH);
  for (const s of stars) {
    s.tw += 0.05; const a = 0.25 + 0.5 * Math.abs(Math.sin(s.tw));
    cx.fillStyle = "rgba(200,220,255," + a.toFixed(2) + ")";
    cx.fillRect(s.x % VW, s.y, s.s, s.s);
  }

  if (state === "menu") { drawMenu(); cx.restore(); return; }

  // ---- road ----
  const zTop = dist; const zBottom = dist + 460;
  const rowH = 4;
  for (let y = 0; y < VH; y += rowH) {
    const zz = zBottom - (VH - y) * (460 / VH);
    const cxC = curveAt(zz);
    const widen = 1 + 0.06 * Math.sin(zz * 0.004 + roadSeed[1]);
    const rh = ROAD_HALF * widen;
    // ground
    cx.fillStyle = (Math.floor(zz / 40) % 2 === 0) ? "#120821" : "#0e0619";
    cx.fillRect(0, y, VW, rowH + 1);
    // road slab
    cx.fillStyle = (Math.floor(zz / 24) % 2 === 0) ? "#221633" : "#251838";
    cx.fillRect(VW / 2 + cxC - rh, y, rh * 2, rowH + 1);
    // neon edges
    cx.fillStyle = "#ff4fd8"; cx.fillRect(VW / 2 + cxC - rh - 2, y, 2.5, rowH + 1);
    cx.fillStyle = "#48f0ff"; cx.fillRect(VW / 2 + cxC + rh, y, 2.5, rowH + 1);
    // dashes
    if (Math.floor(zz / 46) % 2 === 0) { cx.fillStyle = "rgba(255,255,255,0.55)"; cx.fillRect(VW / 2 + cxC - 1.5, y, 3, rowH * 2.2); }
  }

  // ---- items (gems/boosts/cones) ----
  for (const it of items) {
    const zRel = it.z - dist;
    if (zRel > 500 || zRel < -60) continue;
    const y = VH * 0.78 - (zRel - 190) * 1.44;
    const ix = VW / 2 + it.off + curveAt(it.z) - curveAt(dist + 190);
    if (it.dead) continue;
    if (it.kind === "gem") drawGem(ix, y, 7, "#7df9ff", "#c9f9ff");
    else if (it.kind === "boost") drawPad(ix, y);
    else drawCone(ix, y);
  }

  // ---- car ----
  drawCar(VW / 2 + carX, VH * 0.78, tilt);

  // ---- particles ----
  for (const p of parts) {
    const a = clamp(1 - p.t / p.life, 0, 1);
    cx.globalAlpha = a; cx.fillStyle = p.col;
    cx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  cx.globalAlpha = 1;

  // ---- speed lines ----
  cx.strokeStyle = "rgba(140,200,255,0.12)"; cx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const x = R() * VW, l = 30 + R() * 80;
    cx.beginPath(); cx.moveTo(x, VH - R() * 200); cx.lineTo(x, VH - R() * 200 + l); cx.stroke();
  }

  // ---- popups ----
  cx.textAlign = "center";
  for (const q of pops) {
    cx.globalAlpha = clamp(1.3 - q.t, 0, 1);
    cx.font = "bold " + q.size + "px system-ui";
    cx.fillStyle = q.col; cx.fillText(q.text, q.x, q.y);
  }
  cx.globalAlpha = 1;

  // ---- HUD ----
  drawHUD();

  if (flash > 0) { cx.fillStyle = "rgba(255,255,255," + (flash * 0.35) + ")"; cx.fillRect(0, 0, VW, VH); }
  if (hitFlash > 0) { hitFlash -= 0.03; }
  cx.restore();
}

function drawGem(x, y, s, c1, c2) {
  const bob = Math.sin(performance.now() / 240 + x * 0.2) * 2;
  cx.save(); cx.translate(x, y + bob);
  cx.fillStyle = c1; cx.beginPath();
  cx.moveTo(0, -s); cx.lineTo(s * 0.8, 0); cx.lineTo(0, s); cx.lineTo(-s * 0.8, 0); cx.closePath(); cx.fill();
  cx.fillStyle = c2; cx.beginPath();
  cx.moveTo(0, -s * 0.45); cx.lineTo(s * 0.35, 0); cx.lineTo(0, s * 0.45); cx.lineTo(-s * 0.35, 0); cx.closePath(); cx.fill();
  cx.restore();
}
function drawPad(x, y) {
  cx.save(); cx.translate(x, y); cx.rotate(Math.sin(performance.now() / 300) * 0.25);
  cx.fillStyle = "#2a1140"; cx.fillRect(-16, -12, 32, 24);
  cx.strokeStyle = "#ff6bd6"; cx.lineWidth = 2.5; cx.strokeRect(-16, -12, 32, 24);
  cx.fillStyle = "#ff9df0"; cx.font = "bold 13px system-ui"; cx.textAlign = "center"; cx.fillText("»", 0, 5);
  cx.restore();
}
function drawCone(x, y) {
  cx.save(); cx.translate(x, y);
  cx.fillStyle = "#e07a2f"; cx.beginPath();
  cx.moveTo(0, -10); cx.lineTo(6, 8); cx.lineTo(-6, 8); cx.closePath(); cx.fill();
  cx.fillStyle = "#fff"; cx.fillRect(-3.4, -2.5, 6.8, 3); cx.fillRect(-5, 5, 10, 2.4);
  cx.restore();
}
function drawCar(x, y, ang) {
  cx.save();
  cx.translate(x, y); cx.rotate(ang);
  // underglow
  cx.fillStyle = "rgba(120,240,255,0.35)";
  cx.fillRect(-15, -22, 30, 44);
  cx.fillStyle = "#12041f"; cx.fillRect(-13, -20, 26, 40);
  // wheels
  cx.fillStyle = "#0a0a12";
  cx.fillRect(-14, -16, 5, 9); cx.fillRect(9, -16, 5, 9);
  cx.fillRect(-15, 6, 6, 10); cx.fillRect(9, 6, 6, 10);
  // body
  cx.fillStyle = "#e8489c";
  cx.fillRect(-11, -19, 22, 38);
  cx.fillStyle = "#ff77c8"; cx.fillRect(-11, -19, 22, 8);
  cx.fillStyle = "#7df9ff"; cx.fillRect(-9, -8, 18, 7);
  cx.fillStyle = "#1a0b2e"; cx.fillRect(-9, 12, 18, 5);
  // tail lights
  cx.fillStyle = "#ff3b5c"; cx.fillRect(-10, 18.5, 6, 2.5); cx.fillRect(4, 18.5, 6, 2.5);
  // drift streak smoke glow
  cx.restore();
}

function drawHUD() {
  cx.textAlign = "left";
  cx.font = "bold 17px system-ui"; cx.fillStyle = "#bff";
  cx.fillText("SCORE " + Math.floor(score), 12, calc(20));
  cx.font = "bold 14px system-ui"; cx.fillStyle = "#f7c";
  cx.fillText("BEST " + Math.floor(Math.max(best, score)), 12, calc(40));
  cx.textAlign = "right";
  cx.fillStyle = "#ffd1f4";
  cx.fillText("💎 " + gems, VW - 14, calc(20));
  cx.fillText(Math.floor(speed / 3) + " km/h", VW - 14, calc(40));
  if (combo > 1 && comboT > 0.2) {
    cx.textAlign = "center";
    const s = 1 + Math.min(combo, 8) * 0.09;
    cx.font = "bold " + Math.floor(22 * s) + "px system-ui";
    cx.fillStyle = "rgba(255,230,110,0.95)";
    cx.fillText("DRIFT x" + combo, VW / 2, calc(88));
  }
  function calc(y) { return y + Math.min(0, (VH * scale - innerHeight) / 2); }
}
function drawMenu() {
  const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 300);
  cx.textAlign = "center";
  cx.font = "900 54px system-ui";
  const tg = cx.createLinearGradient(60, 0, 360, 0);
  tg.addColorStop(0, "#48f0ff"); tg.addColorStop(1, "#ff4fd8");
  cx.fillStyle = tg;
  cx.fillText("NEON", VW / 2, VH * 0.30);
  cx.fillText("DRIFT", VW / 2, VH * 0.30 + 58);
  cx.font = "bold 16px system-ui"; cx.fillStyle = "#9df";
  cx.fillText("one thumb · endless · drift chains = points", VW / 2, VH * 0.30 + 96);
  cx.font = "bold 18px system-ui";
  cx.fillStyle = "rgba(120,240,255," + pulse.toFixed(2) + ")";
  cx.fillText("TAP TO START", VW / 2, VH * 0.62);
  cx.font = "14px system-ui"; cx.fillStyle = "#c9f";
  cx.fillText("BEST " + Math.floor(best), VW / 2, VH * 0.68);
  cx.font = "12px system-ui"; cx.fillStyle = "rgba(200,200,220,0.5)";
  cx.fillText("hold left / right half to steer · drift to chain combos", VW / 2, VH * 0.74);
  cx.fillText("💎 gems & » boosts · cones = CRUNCH", VW / 2, VH * 0.77);
  cx.fillText("a pixel build for phil 🤖", VW / 2, VH * 0.93);
}

/* ---------------- loop ---------------- */
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === "play") update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* end-of-run scoring hook (banked when combo lost is inside update) */
setInterval(function () {
  if (state === "play" && score > best) {
    best = score; localStorage.setItem("neondrift_best", Math.floor(best));
  }
}, 1500);
window.__state = function(){ return {state: state, score: Math.floor(score), dist: Math.floor(dist), errs: window.__errs || null, best: Math.floor(best)}; };
</script>
